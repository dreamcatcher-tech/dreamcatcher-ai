name: Static site checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static site
        run: node scripts/check-site.mjs
      - name: Build static output
        run: node scripts/build.mjs
