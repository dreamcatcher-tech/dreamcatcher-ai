<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Coach logo options</title>
<style>
  :root{--ink:#06111f;--navy:#0d2238;--teal:#58d7d3;--gold:#f5c76b;--cream:#f8f4e8;--muted:rgba(248,244,232,.70)}
  *{box-sizing:border-box} html,body{height:100%;margin:0} body{overflow:hidden;background:radial-gradient(circle at 70% 18%,#184a62,#06111f 58%,#02060b);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #stage{height:100%;padding:34px 44px;display:grid;grid-template-rows:auto 1fr auto;gap:18px;cursor:pointer}
  .kicker{color:var(--teal);text-transform:uppercase;letter-spacing:.16em;font-size:14px;font-weight:900} .title{font-size:40px;line-height:1.02;letter-spacing:-.055em;font-weight:900;margin-top:8px} .title span{color:var(--gold)}
  .logo-wrap{display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(88,215,211,.08));box-shadow:0 28px 80px rgba(0,0,0,.34);padding:34px;min-height:390px}
  #hero{width:min(1120px,96%);max-height:360px;object-fit:contain;border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.32);background:#fff}
  .bar{display:flex;align-items:center;gap:16px;border:1px solid rgba(88,215,211,.24);border-radius:999px;background:rgba(6,17,31,.64);padding:12px 16px;backdrop-filter:blur(10px)}
  #caption{font-size:18px;font-weight:850;letter-spacing:-.02em} #caption strong{color:var(--gold)} .hint{color:var(--muted);font-weight:750;margin-left:.35em} .dots{margin-left:auto;display:flex;gap:9px} .dot{width:10px;height:10px;border-radius:50%;background:rgba(248,244,232,.34)} .dot.active{background:var(--teal);box-shadow:0 0 20px rgba(88,215,211,.75)}
  .fallback{display:none;color:var(--gold);font-weight:800}
</style>
</head>
<body>
  <main id="stage" aria-label="Click-through Class Coach logo options">
    <header><div class="kicker">Logo review</div><div class="title">Click / tap through <span>six Class Coach logo directions</span>.</div></header>
    <section class="logo-wrap"><img id="hero" alt="Class Coach logo option"><div class="fallback" id="fallback">Logo option failed to load. Check classcoach-logo assets.</div></section>
    <aside class="bar"><div id="caption" aria-live="polite"></div><div class="dots" id="dots" aria-hidden="true"></div></aside>
  </main>
  <script>
    const assetNames = [
      'classcoach-logo-01.svg',
      'classcoach-logo-02.svg',
      'classcoach-logo-03.svg',
      'classcoach-logo-04.svg',
      'classcoach-logo-05.svg',
      'classcoach-logo-06.svg'
    ];
    const titles = [
      'Option 1 · Hex book and AI coaching nodes',
      'Option 2 · Private question / classroom board',
      'Option 3 · Confident CC monogram',
      'Option 4 · Compass for guided learning',
      'Option 5 · Trusted support shield',
      'Option 6 · Minimal book and gold underline'
    ];
    const candidates = (name) => [`../assets/${name}`, `../../Assets/slide-deck-seeds/${name}`];
    const images = assetNames.map((name, i) => ({ name, title: titles[i], srcs: candidates(name) }));
    const hero = document.querySelector('#hero'); const caption = document.querySelector('#caption'); const dots = document.querySelector('#dots'); const fallback = document.querySelector('#fallback'); const stage = document.querySelector('#stage');
    let index = 0; let srcAttempt = 0;
    images.forEach((_, i) => { const dot = document.createElement('span'); dot.className='dot'; dots.appendChild(dot); });
    function render() { srcAttempt=0; fallback.style.display='none'; hero.style.display='block'; hero.src=images[index].srcs[srcAttempt]; hero.alt=`Class Coach logo option ${index+1}`; caption.innerHTML=`<strong>${images[index].title}</strong><span class="hint">Click / tap to cycle ${index+1}/${images.length}</span>`; dots.querySelectorAll('.dot').forEach((dot,i)=>dot.classList.toggle('active',i===index)); }
    function next() { index=(index+1)%images.length; render(); }
    hero.addEventListener('error', () => { srcAttempt += 1; if (srcAttempt < images[index].srcs.length) hero.src = images[index].srcs[srcAttempt]; else { hero.style.display='none'; fallback.style.display='block'; } });
    stage.addEventListener('click', next); document.addEventListener('keydown', (event) => { if (event.key === ' ' || event.key === 'Enter' || event.key === 'ArrowRight') next(); if (event.key === 'ArrowLeft') { index=(index+images.length-1)%images.length; render(); } });
    images.slice(1).forEach((image) => image.srcs.forEach((src) => { const preload = new Image(); preload.src = src; })); render();
  </script>
</body>
</html>
