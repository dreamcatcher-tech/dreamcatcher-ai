<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ark components architecture cycle</title>
  <style>
    :root { --ink:#06111f; --blue:#0d2238; --teal:#58d7d3; --gold:#f5c76b; --cream:#f8f4e8; --muted:rgba(248,244,232,.68); --rose:#ff8aa3; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ink); color:var(--cream); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stage { width:100vw; height:100vh; position:relative; cursor:pointer; background:radial-gradient(circle at 55% 36%, rgba(88,215,211,.18), transparent 38%), linear-gradient(135deg,#06111f,#0d2238 54%,#02060b); }
    .variant { position:absolute; inset:0; display:none; padding:20px; }
    .variant.active { display:block; }
    svg { width:100%; height:100%; display:block; border-radius:24px; }
    .caption { position:absolute; left:24px; bottom:20px; max-width:840px; padding:12px 16px; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:rgba(6,17,31,.72); box-shadow:0 18px 46px rgba(0,0,0,.34); backdrop-filter:blur(10px); font-size:16px; }
    .caption strong { color:var(--gold); }
    .caption span { color:var(--muted); margin-left:.45em; }
    .dots { position:absolute; right:24px; bottom:24px; display:flex; gap:9px; padding:9px 12px; border-radius:999px; background:rgba(6,17,31,.60); border:1px solid rgba(255,255,255,.12); }
    .dot { width:10px; height:10px; border-radius:50%; background:rgba(248,244,232,.32); }
    .dot.active { background:var(--teal); box-shadow:0 0 18px rgba(88,215,211,.76); }
    .h { font:900 31px Inter,Arial,sans-serif; fill:var(--cream); letter-spacing:-.04em; }
    .t { font:800 16px Inter,Arial,sans-serif; fill:var(--gold); }
    .s { font:600 12.5px Inter,Arial,sans-serif; fill:rgba(248,244,232,.73); }
    .mini { font:800 10px Inter,Arial,sans-serif; fill:var(--teal); letter-spacing:.10em; text-transform:uppercase; }
    .box { fill:rgba(255,255,255,.055); stroke:rgba(255,255,255,.16); stroke-width:1.4; }
    .goldbox { fill:rgba(245,199,107,.11); stroke:rgba(245,199,107,.62); stroke-width:1.8; }
    .tealbox { fill:rgba(88,215,211,.10); stroke:rgba(88,215,211,.58); stroke-width:1.8; }
    .vaultbox { fill:rgba(255,138,163,.12); stroke:rgba(255,138,163,.65); stroke-width:1.8; }
    .arrow { fill:none; stroke:var(--teal); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .goldarrow { fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowGold); }
    .dash { stroke-dasharray:8 8; }
    .faint { opacity:.24; }
  </style>
</head>
<body>
<main id="stage" aria-label="Interactive Ark architecture diagram; click to cycle through versions">
  <section class="variant active" data-title="Version A: layered Ark anatomy">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Layered Ark anatomy showing model socket, toolbay, archive, vault, conscience, and open ports">
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#58d7d3"/></marker>
        <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f5c76b"/></marker>
      </defs>
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">architecture view</text><text x="54" y="106" class="h">The Ark holds continuity while capabilities plug in.</text>
      <ellipse cx="675" cy="392" rx="355" ry="218" fill="none" stroke="#58d7d3" stroke-width="4" opacity=".74"/>
      <ellipse cx="675" cy="392" rx="424" ry="276" fill="none" stroke="#f5c76b" stroke-width="2" stroke-dasharray="13 15" opacity=".40"/>
      <rect x="470" y="270" width="410" height="238" rx="42" class="goldbox"/>
      <text x="608" y="316" class="h" style="font-size:35px">Ark</text>
      <text x="543" y="342" class="s">person-owned portable operating system</text>
      <rect x="508" y="378" width="148" height="78" rx="20" class="box"/><text x="536" y="411" class="t">Archive</text><text x="533" y="436" class="s">long-running history</text>
      <rect x="694" y="378" width="130" height="78" rx="20" class="vaultbox"/><text x="729" y="411" class="t">Vault</text><text x="715" y="436" class="s">sensitive secrets</text>
      <rect x="514" y="186" width="322" height="52" rx="18" class="tealbox"/><text x="548" y="219" class="t">Conscience: transparent boundary and permissions</text>
      <rect x="73" y="244" width="238" height="90" rx="24" class="tealbox"/><text x="112" y="284" class="t">Model Socket</text><text x="104" y="310" class="s">AI models plug in and change</text>
      <rect x="73" y="438" width="238" height="90" rx="24" class="goldbox"/><text x="139" y="478" class="t">Toolbay</text><text x="104" y="504" class="s">tools connect, leave, return</text>
      <rect x="974" y="332" width="238" height="90" rx="24" class="box"/><text x="1037" y="372" class="t">Open Ports</text><text x="1010" y="398" class="s">export, restore, migrate</text>
      <path class="arrow" d="M311 289 C390 295 421 322 470 360"/><text x="326" y="273" class="s">model context</text>
      <path class="goldarrow" d="M311 483 C394 470 424 452 470 424"/><text x="329" y="521" class="s">tool calls</text>
      <path class="arrow" d="M880 392 C919 387 944 383 974 378"/><text x="892" y="365" class="s">permissioned movement</text>
      <path class="arrow dash" d="M760 378 C760 344 742 316 704 238"/><text x="788" y="302" class="s">checked access</text>
      <path class="goldarrow dash" d="M582 456 C610 506 657 534 720 536"/><text x="612" y="551" class="s">history accumulates</text>
    </svg>
  </section>

  <section class="variant" data-title="Version B: simple operating system">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Ark as a simple operating system with buses and modular plugs">
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#58d7d3"/></marker>
        <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f5c76b"/></marker>
      </defs>
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">operating-system view</text><text x="54" y="106" class="h">Models and tools are peripherals. The Ark is the chassis.</text>
      <rect x="248" y="164" width="784" height="406" rx="42" fill="rgba(255,255,255,.035)" stroke="rgba(88,215,211,.32)" stroke-width="2"/>
      <rect x="312" y="330" width="656" height="58" rx="29" fill="rgba(88,215,211,.18)" stroke="#58d7d3" stroke-width="2"/>
      <text x="533" y="367" class="t" style="font-size:22px">Ark OS bus: context · permissions · actions · audit traces</text>
      <rect x="318" y="208" width="174" height="86" rx="22" class="box"/><text x="365" y="245" class="t">Archive</text><text x="351" y="270" class="s">history + evidence</text>
      <rect x="553" y="208" width="174" height="86" rx="22" class="vaultbox"/><text x="605" y="245" class="t">Vault</text><text x="587" y="270" class="s">private controls</text>
      <rect x="788" y="208" width="174" height="86" rx="22" class="tealbox"/><text x="824" y="245" class="t">Conscience</text><text x="817" y="270" class="s">explainable checks</text>
      <rect x="318" y="426" width="260" height="94" rx="24" class="tealbox"/><text x="368" y="463" class="t">Model Socket</text><text x="349" y="489" class="s">one model can be replaced by another</text>
      <rect x="702" y="426" width="260" height="94" rx="24" class="goldbox"/><text x="792" y="463" class="t">Toolbay</text><text x="736" y="489" class="s">tools are composed, revoked, swapped</text>
      <path class="arrow" d="M405 294V330"/><path class="arrow dash" d="M640 294V330"/><path class="arrow" d="M875 294V330"/>
      <path class="arrow" d="M448 426V388"/><path class="goldarrow" d="M832 426V388"/>
      <rect x="72" y="250" width="132" height="94" rx="24" class="tealbox"/><text x="111" y="288" class="t">Model</text><text x="93" y="314" class="s">plug-in</text>
      <path class="arrow" d="M204 297H318"/>
      <rect x="1076" y="250" width="132" height="94" rx="24" class="goldbox"/><text x="1118" y="288" class="t">Tool</text><text x="1094" y="314" class="s">plug-in</text>
      <path class="goldarrow" d="M1076 297H962"/>
      <text x="285" y="626" class="s" style="font-size:17px">Everything that crosses the bus is inspectable. Sensitive flows are tightly constrained. The owner can export and restore the Ark.</text>
    </svg>
  </section>

  <section class="variant" data-title="Version C: outlast timeline">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Ark outlast timeline showing continuity across changing models and tools">
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#58d7d3"/></marker>
        <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f5c76b"/></marker>
      </defs>
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">outlast view</text><text x="54" y="106" class="h">The Ark persists while models, tools, and institutions change.</text>
      <line x1="144" y1="570" x2="1138" y2="570" stroke="#58d7d3" stroke-width="4" marker-end="url(#arrow)" opacity=".84"/>
      <text x="138" y="610" class="s">year 1</text><text x="492" y="610" class="s">year 5</text><text x="836" y="610" class="s">year 12</text><text x="1088" y="610" class="s">leave, restore, continue</text>
      <rect x="431" y="214" width="418" height="230" rx="44" class="goldbox"/>
      <text x="540" y="285" class="h" style="font-size:42px">Owned Ark</text>
      <text x="510" y="326" class="s" style="font-size:17px">Archive grows · Vault remains constrained</text>
      <text x="498" y="356" class="s" style="font-size:17px">Conscience explains · open ports prove ownership</text>
      <rect x="90" y="198" width="200" height="74" rx="22" class="tealbox"/><text x="126" y="242" class="t">Model A</text>
      <rect x="90" y="308" width="200" height="74" rx="22" class="goldbox"/><text x="138" y="352" class="t">Tool set 1</text>
      <rect x="990" y="198" width="200" height="74" rx="22" class="tealbox"/><text x="1024" y="242" class="t">Model B</text>
      <rect x="990" y="308" width="200" height="74" rx="22" class="goldbox"/><text x="1029" y="352" class="t">New tools</text>
      <path class="arrow" d="M290 235C356 242 386 260 431 286"/><path class="goldarrow" d="M290 345C356 342 389 360 431 388"/>
      <path class="arrow" d="M849 286C900 260 932 244 990 235"/><path class="goldarrow" d="M849 388C905 368 936 350 990 345"/>
      <rect x="444" y="492" width="392" height="66" rx="24" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.18)"/>
      <text x="480" y="533" class="t">Outlast: durable, portable, protected continuity</text>
    </svg>
  </section>

  <div class="caption" id="caption" aria-live="polite"></div><div class="dots" id="dots" aria-hidden="true"></div>
</main>
<script>
  const variants = [...document.querySelectorAll('.variant')];
  const caption = document.querySelector('#caption');
  const dots = document.querySelector('#dots');
  let index = 0;
  variants.forEach((_, i) => { const dot = document.createElement('span'); dot.className = 'dot'; dots.append(dot); });
  function render() { variants.forEach((v, i) => v.classList.toggle('active', i === index)); dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index)); caption.innerHTML = `<strong>${variants[index].dataset.title}</strong><span>Tap / click to cycle ${index + 1}/${variants.length}</span>`; }
  function next() { index = (index + 1) % variants.length; render(); }
  document.querySelector('#stage').addEventListener('click', next);
  document.addEventListener('keydown', (event) => { if ([' ', 'Enter', 'ArrowRight'].includes(event.key)) next(); if (event.key === 'ArrowLeft') { index = (index + variants.length - 1) % variants.length; render(); } });
  render();
</script>
</body>
</html>
