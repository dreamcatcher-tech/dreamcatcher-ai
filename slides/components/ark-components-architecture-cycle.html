<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ark components architecture cycle</title>
  <style>
    :root { --ink:#06111f; --blue:#0d2238; --teal:#58d7d3; --gold:#f5c76b; --cream:#f8f4e8; --muted:rgba(248,244,232,.70); --green:#8ee7a7; --rose:#ff8aa3; --red:#ff6b7d; --violet:#bda7ff; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--ink); color:var(--cream); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stage { width:100vw; height:100vh; position:relative; cursor:pointer; background:radial-gradient(circle at 54% 36%, rgba(88,215,211,.18), transparent 36%), linear-gradient(135deg,#06111f,#0d2238 54%,#02060b); }
    .variant { position:absolute; inset:0; display:none; padding:20px; }
    .variant.active { display:block; }
    svg { width:100%; height:100%; display:block; border-radius:24px; }
    .caption { position:absolute; left:24px; bottom:20px; max-width:930px; padding:12px 16px; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:rgba(6,17,31,.76); box-shadow:0 18px 46px rgba(0,0,0,.34); backdrop-filter:blur(10px); font-size:16px; }
    .caption strong { color:var(--gold); }
    .caption span { color:var(--muted); margin-left:.45em; }
    .dots { position:absolute; right:24px; bottom:24px; display:flex; gap:9px; padding:9px 12px; border-radius:999px; background:rgba(6,17,31,.60); border:1px solid rgba(255,255,255,.12); }
    .dot { width:10px; height:10px; border-radius:50%; background:rgba(248,244,232,.32); }
    .dot.active { background:var(--teal); box-shadow:0 0 18px rgba(88,215,211,.76); }
    .h { font:900 31px Inter,Arial,sans-serif; fill:var(--cream); letter-spacing:-.04em; }
    .t { font:800 16px Inter,Arial,sans-serif; fill:var(--gold); }
    .s { font:600 12.5px Inter,Arial,sans-serif; fill:rgba(248,244,232,.75); }
    .m { font:700 14px Inter,Arial,sans-serif; fill:rgba(248,244,232,.83); }
    .mini { font:800 10px Inter,Arial,sans-serif; fill:var(--teal); letter-spacing:.10em; text-transform:uppercase; }
    .box { fill:rgba(255,255,255,.055); stroke:rgba(255,255,255,.18); stroke-width:1.5; }
    .arkbox { fill:rgba(245,199,107,.10); stroke:rgba(245,199,107,.70); stroke-width:2.2; }
    .goldbox { fill:rgba(245,199,107,.12); stroke:rgba(245,199,107,.68); stroke-width:1.9; }
    .tealbox { fill:rgba(88,215,211,.12); stroke:rgba(88,215,211,.66); stroke-width:1.9; }
    .greenbox { fill:rgba(142,231,167,.11); stroke:rgba(142,231,167,.62); stroke-width:1.9; }
    .vaultbox { fill:rgba(255,138,163,.13); stroke:rgba(255,138,163,.68); stroke-width:1.9; }
    .violetbox { fill:rgba(189,167,255,.12); stroke:rgba(189,167,255,.68); stroke-width:1.9; }
    .darkbox { fill:rgba(6,17,31,.78); stroke:rgba(255,255,255,.18); stroke-width:1.5; }
    .arrow { fill:none; stroke:var(--teal); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .goldarrow { fill:none; stroke:var(--gold); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowGold); }
    .greenarrow { fill:none; stroke:var(--green); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowGreen); }
    .redarrow { fill:none; stroke:var(--red); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowRed); }
    .violetarrow { fill:none; stroke:var(--violet); stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowViolet); }
    .dash { stroke-dasharray:8 8; }
    .ring { fill:none; stroke:#58d7d3; stroke-width:4; stroke-dasharray:14 12; opacity:.78; }
  </style>
</head>
<body>
<main id="stage" aria-label="Interactive Ark architecture and Conscience data-flow diagrams; click to cycle through six versions">
  <svg width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#58d7d3"/></marker>
      <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f5c76b"/></marker>
      <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8ee7a7"/></marker>
      <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6b7d"/></marker>
      <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#bda7ff"/></marker>
    </defs>
  </svg>

  <section class="variant active" data-title="Version A: anatomy — the Conscience is the crossing point">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Ark anatomy showing Conscience as the crossing point for models, tools, archive, vault, and open ports">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">anatomy view</text><text x="54" y="106" class="h">The Ark holds continuity. The Conscience governs crossings.</text>
      <ellipse cx="656" cy="372" rx="356" ry="228" class="ring"/>
      <rect x="420" y="218" width="472" height="312" rx="48" class="arkbox"/>
      <text x="590" y="274" class="h" style="font-size:38px">Ark</text>
      <text x="520" y="306" class="s" style="font-size:16px">owner-held continuity layer</text>
      <rect x="474" y="356" width="150" height="76" rx="20" class="box"/><text x="520" y="389" class="t">Archive</text><text x="507" y="415" class="s">history + evidence</text>
      <rect x="654" y="356" width="132" height="76" rx="20" class="vaultbox"/><text x="689" y="389" class="t">Vault</text><text x="672" y="415" class="s">sensitive controls</text>
      <rect x="562" y="452" width="158" height="52" rx="18" class="tealbox"/><text x="612" y="486" class="t">Agent</text>
      <rect x="486" y="160" width="330" height="56" rx="20" class="tealbox"/><text x="525" y="195" class="t">Conscience: checks every crossing</text>
      <rect x="74" y="220" width="248" height="92" rx="24" class="tealbox"/><text x="113" y="258" class="t">Model Socket</text><text x="105" y="285" class="s">model context is minimized</text>
      <rect x="74" y="438" width="248" height="92" rx="24" class="goldbox"/><text x="146" y="476" class="t">Toolbay</text><text x="112" y="503" class="s">tools need scoped grants</text>
      <rect x="996" y="320" width="214" height="92" rx="24" class="box"/><text x="1043" y="358" class="t">Open Ports</text><text x="1028" y="385" class="s">export · restore · migrate</text>
      <path class="arrow" d="M322 266C398 266 430 216 486 190"/><text x="340" y="248" class="s">context request</text>
      <path class="goldarrow" d="M322 484C408 474 462 506 562 480"/><text x="344" y="527" class="s">tool request</text>
      <path class="arrow" d="M816 188C880 206 922 252 996 342"/><text x="850" y="224" class="s">approved movement</text>
      <path class="greenarrow dash" d="M658 216C660 272 652 320 624 356"/><text x="512" y="346" class="s">checked access</text>
      <path class="redarrow dash" d="M740 356C760 318 762 268 710 216"/><text x="744" y="454" class="s">raw secrets stay constrained</text>
    </svg>
  </section>

  <section class="variant" data-title="Version B: inbound request — ask, check, minimize, answer">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Inbound data flow through Conscience from outside requester to Ark and back as approved summary">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">inbound data flow</text><text x="54" y="106" class="h">Outside requests do not enter raw. They pass through judgement.</text>
      <rect x="70" y="250" width="210" height="128" rx="30" class="box"/><text x="108" y="302" class="t">Requester</text><text x="96" y="330" class="s">teacher · parent · app</text><text x="100" y="356" class="s">asks for information</text>
      <rect x="390" y="174" width="300" height="306" rx="42" class="tealbox"/><text x="468" y="230" class="h" style="font-size:34px">Conscience</text>
      <rect x="430" y="268" width="220" height="46" rx="18" class="darkbox"/><text x="456" y="297" class="s">purpose · role · consent</text>
      <rect x="430" y="328" width="220" height="46" rx="18" class="darkbox"/><text x="464" y="357" class="s">scope · age · policy</text>
      <rect x="430" y="388" width="220" height="46" rx="18" class="darkbox"/><text x="478" y="417" class="s">minimize · explain</text>
      <rect x="820" y="190" width="250" height="114" rx="30" class="arkbox"/><text x="888" y="238" class="t">Archive</text><text x="860" y="265" class="s">records · history · evidence</text>
      <rect x="820" y="378" width="250" height="114" rx="30" class="vaultbox"/><text x="914" y="426" class="t">Vault</text><text x="858" y="453" class="s">secrets · recovery · money rails</text>
      <path class="arrow" d="M280 314H390"/><text x="304" y="292" class="s">request</text>
      <path class="greenarrow" d="M690 262C738 250 770 246 820 246"/><text x="710" y="226" class="s">safe query</text>
      <path class="redarrow dash" d="M820 430C752 426 720 404 690 380"/><text x="702" y="438" class="s">raw secret refused</text>
      <path class="goldarrow" d="M390 402C320 426 256 418 168 378"/><text x="188" y="438" class="s">approved summary + explanation</text>
      <rect x="138" y="500" width="1030" height="62" rx="26" class="box"/><text x="194" y="538" class="m">Result: the requester gets only the permitted shape of the data — not a free look inside the Ark.</text>
    </svg>
  </section>

  <section class="variant" data-title="Version C: model context — enough to help, not everything">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Model context flow where Conscience selects, redacts, sends, checks, and returns answer through Agent">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">model context flow</text><text x="54" y="106" class="h">The model sees a shaped context, not the whole Ark.</text>
      <rect x="78" y="238" width="216" height="108" rx="28" class="arkbox"/><text x="143" y="283" class="t">Archive</text><text x="112" y="310" class="s">long memory and evidence</text>
      <rect x="78" y="430" width="216" height="108" rx="28" class="vaultbox"/><text x="161" y="475" class="t">Vault</text><text x="114" y="502" class="s">sensitive constraints</text>
      <rect x="406" y="210" width="276" height="312" rx="42" class="tealbox"/><text x="464" y="262" class="h" style="font-size:32px">Conscience</text>
      <rect x="442" y="318" width="204" height="46" rx="18" class="darkbox"/><text x="482" y="347" class="s">select relevant facts</text>
      <rect x="442" y="376" width="204" height="46" rx="18" class="darkbox"/><text x="488" y="405" class="s">redact or withhold</text>
      <rect x="442" y="434" width="204" height="46" rx="18" class="darkbox"/><text x="474" y="463" class="s">attach instructions</text>
      <rect x="790" y="236" width="256" height="122" rx="30" class="tealbox"/><text x="858" y="284" class="t">Model Socket</text><text x="834" y="313" class="s">replaceable AI model</text>
      <rect x="790" y="444" width="256" height="96" rx="28" class="greenbox"/><text x="886" y="486" class="t">Agent</text><text x="832" y="512" class="s">uses answer inside the Ark</text>
      <path class="greenarrow" d="M294 292C350 294 374 310 406 334"/><text x="314" y="276" class="s">relevant history</text>
      <path class="redarrow dash" d="M294 484C356 476 382 452 406 418"/><text x="304" y="526" class="s">secret boundary</text>
      <path class="arrow" d="M682 340C720 330 754 312 790 300"/><text x="710" y="278" class="s">minimal context</text>
      <path class="goldarrow" d="M918 358V444"/><text x="942" y="408" class="s">answer checked</text>
      <path class="greenarrow dash" d="M790 492C632 570 444 574 212 538"/><text x="462" y="600" class="s">audit trace saved back to Archive</text>
    </svg>
  </section>

  <section class="variant" data-title="Version D: tool action — intent, approval, execution, audit">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Tool action flow from Agent through Conscience to Toolbay and external service with audit trail">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">tool action flow</text><text x="54" y="106" class="h">The Agent can act only through scoped, explainable grants.</text>
      <rect x="84" y="292" width="218" height="126" rx="30" class="greenbox"/><text x="158" y="344" class="t">Agent</text><text x="110" y="372" class="s">proposes an action</text><text x="104" y="398" class="s">with reason and cost</text>
      <rect x="396" y="210" width="270" height="284" rx="42" class="tealbox"/><text x="458" y="262" class="h" style="font-size:32px">Conscience</text>
      <rect x="430" y="316" width="202" height="44" rx="17" class="darkbox"/><text x="458" y="344" class="s">scope the action</text>
      <rect x="430" y="370" width="202" height="44" rx="17" class="darkbox"/><text x="462" y="398" class="s">ask approval if needed</text>
      <rect x="430" y="424" width="202" height="44" rx="17" class="darkbox"/><text x="472" y="452" class="s">log and revoke</text>
      <rect x="784" y="252" width="240" height="112" rx="30" class="goldbox"/><text x="854" y="300" class="t">Toolbay</text><text x="820" y="328" class="s">tools · apps · services</text>
      <rect x="1048" y="252" width="160" height="112" rx="30" class="box"/><text x="1086" y="300" class="t">Service</text><text x="1088" y="328" class="s">external API</text>
      <rect x="784" y="492" width="240" height="78" rx="24" class="arkbox"/><text x="844" y="540" class="t">Archive audit trace</text>
      <path class="arrow" d="M302 354H396"/><text x="320" y="332" class="s">intent</text>
      <path class="goldarrow" d="M666 314H784"/><text x="700" y="292" class="s">scoped grant</text>
      <path class="goldarrow" d="M1024 308H1048"/><text x="1022" y="238" class="s">execute</text>
      <path class="greenarrow" d="M904 364V492"/><text x="924" y="430" class="s">result + trace</text>
      <path class="redarrow dash" d="M530 210C520 156 462 142 390 158"/><text x="280" y="164" class="s">block / explain if too risky</text>
      <rect x="112" y="524" width="496" height="58" rx="24" class="box"/><text x="150" y="560" class="m">The tool receives only the permission it needs, for the time it needs.</text>
    </svg>
  </section>

  <section class="variant" data-title="Version E: Vault crossing — answers without leaking secrets">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Vault crossing flow showing Conscience mediating sensitive material and returning answer without raw secret exposure">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">vault crossing</text><text x="54" y="106" class="h">Sensitive material is used through the boundary, not exposed.</text>
      <rect x="76" y="276" width="230" height="126" rx="30" class="box"/><text x="122" y="324" class="t">High-risk request</text><text x="116" y="352" class="s">sign · pay · recover</text><text x="124" y="378" class="s">credential · private record</text>
      <rect x="410" y="210" width="284" height="302" rx="42" class="tealbox"/><text x="482" y="262" class="h" style="font-size:32px">Conscience</text>
      <rect x="446" y="318" width="212" height="44" rx="17" class="darkbox"/><text x="486" y="346" class="s">owner approval</text>
      <rect x="446" y="374" width="212" height="44" rx="17" class="darkbox"/><text x="474" y="402" class="s">risk limit + purpose</text>
      <rect x="446" y="430" width="212" height="44" rx="17" class="darkbox"/><text x="490" y="458" class="s">refuse or answer</text>
      <rect x="838" y="242" width="260" height="198" rx="42" class="vaultbox"/><text x="916" y="314" class="h" style="font-size:34px">Vault</text><text x="878" y="354" class="s" style="font-size:15px">keys · payment rails · recovery</text><text x="890" y="382" class="s" style="font-size:15px">raw secrets stay inside</text>
      <rect x="838" y="512" width="260" height="74" rx="24" class="arkbox"/><text x="908" y="558" class="t">Audit + revocation</text>
      <path class="arrow" d="M306 340H410"/><text x="326" y="318" class="s">sensitive ask</text>
      <path class="redarrow dash" d="M694 332H838"/><text x="718" y="306" class="s">raw secret never leaves</text>
      <path class="goldarrow" d="M838 386C754 408 722 438 694 454"/><text x="728" y="464" class="s">answer / signature / token</text>
      <path class="greenarrow" d="M968 440V512"/><text x="988" y="484" class="s">trace</text>
      <path class="goldarrow" d="M410 454C318 462 242 440 190 402"/><text x="176" y="476" class="s">approved result</text>
      <rect x="136" y="558" width="514" height="56" rx="24" class="box"/><text x="172" y="593" class="m">The Vault can answer, sign, redact, or refuse — without handing out the raw material.</text>
    </svg>
  </section>

  <section class="variant" data-title="Version F: Ark-to-Ark crossing — summaries move, interiors stay private">
    <svg viewBox="0 0 1280 720" role="img" aria-label="Ark-to-Ark data flow showing Conscience boundaries between child, parent, and teacher Arks">
      <rect width="1280" height="720" rx="28" fill="rgba(6,17,31,.34)" stroke="rgba(255,255,255,.08)"/>
      <text x="54" y="68" class="mini">community crossing</text><text x="54" y="106" class="h">Arks can collaborate without becoming one shared dossier.</text>
      <rect x="498" y="220" width="286" height="178" rx="42" class="arkbox"/><text x="570" y="276" class="h" style="font-size:32px">Child Ark</text><text x="548" y="312" class="s" style="font-size:15px">work · reflection · learning history</text><rect x="552" y="342" width="180" height="38" rx="15" class="tealbox"/><text x="586" y="366" class="t">Conscience</text>
      <rect x="90" y="250" width="250" height="146" rx="38" class="arkbox"/><text x="154" y="304" class="h" style="font-size:30px">Parent Ark</text><text x="130" y="338" class="s">care context · home support</text><rect x="122" y="362" width="184" height="36" rx="15" class="tealbox"/><text x="158" y="386" class="t">Conscience</text>
      <rect x="940" y="250" width="250" height="146" rx="38" class="arkbox"/><text x="1008" y="304" class="h" style="font-size:30px">Teacher Ark</text><text x="970" y="338" class="s">rubric · feedback · evidence</text><rect x="972" y="362" width="184" height="36" rx="15" class="tealbox"/><text x="1008" y="386" class="t">Conscience</text>
      <rect x="410" y="510" width="460" height="76" rx="28" class="box"/><text x="500" y="557" class="t">Shared channel: digest · support · artifact</text>
      <path class="greenarrow" d="M340 326C410 318 448 318 498 326"/><text x="368" y="296" class="s">care context</text>
      <path class="goldarrow" d="M940 326C868 318 830 318 784 326"/><text x="818" y="296" class="s">assignment + feedback</text>
      <path class="arrow" d="M642 398V510"/><text x="662" y="462" class="s">checked digest</text>
      <path class="arrow dash" d="M410 548C306 512 242 460 214 396"/><text x="254" y="506" class="s">parent-visible support</text>
      <path class="goldarrow dash" d="M870 548C972 512 1034 460 1064 396"/><text x="910" y="506" class="s">teacher-visible evidence</text>
      <rect x="142" y="610" width="994" height="52" rx="24" class="box"/><text x="230" y="642" class="m">Each Ark keeps its raw interior. The Conscience decides the permitted shape of every crossing.</text>
    </svg>
  </section>

  <div class="caption" id="caption" aria-live="polite"></div><div class="dots" id="dots" aria-hidden="true"></div>
</main>
<script>
  const variants = [...document.querySelectorAll('.variant')];
  const caption = document.querySelector('#caption');
  const dots = document.querySelector('#dots');
  const requestedVariant = Number(new URLSearchParams(location.search).get('variant'));
  let index = Number.isInteger(requestedVariant) && requestedVariant >= 1 && requestedVariant <= variants.length ? requestedVariant - 1 : 0;
  variants.forEach((_, i) => { const dot = document.createElement('span'); dot.className = 'dot'; dots.append(dot); });
  function render() { variants.forEach((v, i) => v.classList.toggle('active', i === index)); dots.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index)); caption.innerHTML = `<strong>${variants[index].dataset.title}</strong><span>Tap / click to cycle ${index + 1}/${variants.length}</span>`; }
  function next() { index = (index + 1) % variants.length; render(); }
  document.querySelector('#stage').addEventListener('click', next);
  document.addEventListener('keydown', (event) => { if ([' ', 'Enter', 'ArrowRight'].includes(event.key)) next(); if (event.key === 'ArrowLeft') { index = (index + variants.length - 1) % variants.length; render(); } });
  render();
</script>
</body>
</html>
