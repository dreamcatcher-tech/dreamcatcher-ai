<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreamcatcher.ai slides</title>
  <link rel="stylesheet" href="https://esm.sh/reveal.js@6.0.1/reset.css">
  <link rel="stylesheet" href="https://esm.sh/reveal.js@6.0.1/reveal.css">
  <link rel="stylesheet" href="https://esm.sh/reveal.js@6.0.1/dist/theme/black.css">
  <style>
    :root {
      --dc-ink: #06111f;
      --dc-blue: #0d2238;
      --dc-teal: #58d7d3;
      --dc-gold: #f5c76b;
      --dc-cream: #f8f4e8;
    }
    body { background: radial-gradient(circle at 65% 20%, #12385a 0%, var(--dc-ink) 45%, #02060b 100%); }
    .reveal { color: var(--dc-cream); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .reveal h1, .reveal h2, .reveal h3 { text-transform: none; letter-spacing: -0.035em; color: var(--dc-cream); }
    .reveal h1 { font-size: 2.25em; }
    .reveal h2 { color: var(--dc-gold); }
    .reveal strong, .reveal blockquote { color: var(--dc-gold); }
    .reveal a { color: var(--dc-teal); }
    .reveal p, .reveal li { line-height: 1.22; }
    .reveal blockquote { width: 86%; border-left: 0.18em solid var(--dc-teal); padding-left: 0.7em; background: rgba(255,255,255,0.04); box-shadow: none; }
    .reveal pre code { border-radius: 16px; padding: 1.1em; background: rgba(0,0,0,0.45); }
    .reveal section img { max-height: 52vh; border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
    .reveal .slide-background-content { background-position: center; }
    .reveal .dc-shell { box-sizing: border-box; width: 100%; min-height: 620px; padding: 44px 54px; border-radius: 30px; background: linear-gradient(135deg, rgba(6,17,31,0.96), rgba(13,34,56,0.88)); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 28px 80px rgba(0,0,0,0.34); overflow: hidden; }
    .reveal .dc-cover { min-height: 650px; display: grid; align-content: space-between; background-image: linear-gradient(90deg, rgba(2,6,11,0.94) 0%, rgba(6,17,31,0.86) 38%, rgba(6,17,31,0.23) 100%), var(--cover-image); background-size: cover; background-position: center; }
    .reveal .dc-brand { display: flex; gap: 16px; align-items: center; color: var(--dc-cream); font-weight: 800; letter-spacing: -0.02em; }
    .reveal .dc-brand img { width: 58px; height: 58px; margin: 0; border-radius: 16px; box-shadow: none; background: rgba(255,255,255,0.07); padding: 6px; }
    .reveal .dc-kicker { color: var(--dc-teal); text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.36em; font-weight: 800; margin-bottom: 16px; }
    .reveal .dc-title { font-size: 2.35em; line-height: 0.92; letter-spacing: -0.055em; max-width: 820px; margin: 0; }
    .reveal .dc-subtitle { color: rgba(248,244,232,0.80); font-size: 0.62em; line-height: 1.25; max-width: 760px; margin-top: 22px; }
    .reveal .dc-footerline { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; color: rgba(248,244,232,0.72); font-size: 0.38em; }
    .reveal .dc-grid-2 { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 34px; align-items: stretch; }
    .reveal .dc-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .reveal .dc-card { border: 1px solid rgba(255,255,255,0.11); border-radius: 24px; background: rgba(255,255,255,0.055); padding: 24px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
    .reveal .dc-card h3 { margin: 0 0 12px; color: var(--dc-gold); font-size: 0.78em; letter-spacing: -0.03em; }
    .reveal .dc-card p, .reveal .dc-card li { font-size: 0.46em; color: rgba(248,244,232,0.82); }
    .reveal .dc-bigline { font-size: 1.26em; line-height: 1.04; letter-spacing: -0.045em; color: var(--dc-cream); margin: 12px 0 0; }
    .reveal .dc-pill-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .reveal .dc-pill { border: 1px solid rgba(88,215,211,0.30); background: rgba(88,215,211,0.10); color: var(--dc-teal); border-radius: 999px; padding: 7px 13px; font-size: 0.32em; font-weight: 700; }
    .reveal .dc-muted { color: rgba(248,244,232,0.62); }
    .reveal .dc-quote { font-size: 0.86em; line-height: 1.15; letter-spacing: -0.035em; color: var(--dc-gold); }
    .reveal .dc-component-frame { width: 100%; height: 640px; border: 0; border-radius: 26px; background: #06111f; box-shadow: 0 28px 80px rgba(0,0,0,0.42); }
    #deck-error { display: none; max-width: 820px; margin: 10vh auto; padding: 24px; border: 1px solid rgba(245,199,107,0.45); border-radius: 18px; color: var(--dc-cream); background: rgba(0,0,0,0.55); font-family: ui-sans-serif, system-ui; }
    #deck-error code { color: var(--dc-gold); }
    .dc-export-bar { position: fixed; top: 18px; right: 18px; z-index: 40; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .dc-export-bar a { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(88,215,211,0.38); border-radius: 999px; padding: 9px 14px; color: var(--dc-cream); background: rgba(6,17,31,0.72); text-decoration: none; font-size: 13px; font-weight: 800; letter-spacing: 0.01em; box-shadow: 0 14px 32px rgba(0,0,0,0.28); backdrop-filter: blur(12px); }
    .dc-export-bar a:hover { color: var(--dc-ink); background: var(--dc-teal); }
    @media print { .dc-export-bar { display: none !important; } }
  </style>
</head>
<body>
  <nav class="dc-export-bar" aria-label="Deck downloads">
    <a id="pdf-download-link" href="pdfs/kristin-school-pilot-validation-portfolio.pdf" download="kristin-school-pilot-validation-portfolio.pdf" title="Download this deck as a PDF">Download PDF</a>
  </nav>
  <div id="deck-error"></div>
  <div class="reveal">
    <div class="slides">
      <section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Notes?:">
        <script type="text/template" id="deck-source"></script>
      </section>
    </div>
  </div>

  <script type="module">
    import Reveal from 'https://esm.sh/reveal.js@6.0.1';
    import Markdown from 'https://esm.sh/reveal.js@6.0.1/plugin/markdown';
    import Notes from 'https://esm.sh/reveal.js@6.0.1/plugin/notes';
    import yaml from 'https://esm.sh/js-yaml@4.2.0';

    const errorBox = document.querySelector('#deck-error');
    const showError = (message) => {
      errorBox.style.display = 'block';
      errorBox.innerHTML = message;
      document.querySelector('.reveal').style.display = 'none';
    };

    try {
      const params = new URLSearchParams(location.search);
      const deckParam = params.get('deck') || 'decks/kristin-school-pilot-validation-portfolio.md';
      const deckUrl = new URL(deckParam, location.href);
      const deckFile = deckUrl.pathname.split('/').pop() || 'deck.md';
      const pdfFile = deckFile.replace(/\.md$/i, '.pdf');
      const pdfUrl = new URL(`pdfs/${pdfFile}`, location.href);
      const pdfLink = document.querySelector('#pdf-download-link');
      pdfLink.href = pdfUrl.href;
      pdfLink.download = pdfFile;
      pdfLink.addEventListener('click', async (event) => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        try {
          const pdfResponse = await fetch(pdfLink.href);
          if (!pdfResponse.ok) throw new Error(`${pdfResponse.status} ${pdfResponse.statusText}`);
          const blobUrl = URL.createObjectURL(await pdfResponse.blob());
          const download = document.createElement('a');
          download.href = blobUrl;
          download.download = pdfLink.download || pdfFile;
          document.body.append(download);
          download.click();
          download.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
        } catch (downloadErr) {
          location.href = pdfLink.href;
        }
      });

      // Make relative image/media URLs inside the Markdown resolve relative to the deck file.
      const base = document.createElement('base');
      base.href = deckUrl.href.replace(/[^/]*$/, '');
      document.head.prepend(base);

      const response = await fetch(deckUrl);
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      const raw = await response.text();
      const fm = raw.match(new RegExp('^---\\s*\\n([\\s\\S]*?)\\n---\\s*(?:\\n|$)'));
      const meta = fm ? (yaml.load(fm[1]) || {}) : {};
      const body = fm ? raw.slice(fm[0].length) : raw;

      if (meta.title) document.title = `${meta.title} — Dreamcatcher.ai slides`;
      document.querySelector('#deck-source').textContent = body.trim();

      const deck = new Reveal({
        hash: true,
        controls: true,
        progress: true,
        center: false,
        width: 1280,
        height: 720,
        margin: 0.045,
        plugins: [Markdown, Notes]
      });
      window.Reveal = deck;
      await deck.initialize();
    } catch (err) {
      showError(`Could not load deck. Serve this folder over HTTP and pass <code>?deck=decks/kristin-school-pilot-validation-portfolio.md</code>.<br><br><code>${String(err)}</code>`);
    }
  </script>
</body>
</html>
